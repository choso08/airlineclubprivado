websocketActorSystem {
	pekko {
	  actor {
	    provider = remote
			allow-java-serialization = on
			warn-about-java-serializer-usage = false
	  }
	  remote {
			artery {
				transport = tcp
				canonical {
					#private IP of this server
					hostname = "127.0.0.1"
					port = 2552
				}
				bind {
					hostname = "0.0.0.0"
					port = 2552
				}
	    }
	 }

	}
}

dev=false

# How many real seconds one in-game week lasts. Upstream default is 1800
# (30 minutes). Lower it to make the game move faster; keep it well above the
# time a cycle takes to compute, which the simulation logs on every tick.
simulation {
  cycleDurationSeconds = 1800
  cycleDurationSeconds = ${?AIRLINE_CYCLE_SECONDS}
}

# Database connection, read by com.patson.data.Constants.
# Defaults match a local install; every value can be overridden by an
# environment variable so that no credential has to be committed.
mysqldb {
  host = "localhost:3306"
  host = ${?AIRLINE_DB_HOST}
  schema = "airline_v2_1"
  schema = ${?AIRLINE_DB_SCHEMA}
  user = "sa"
  user = ${?AIRLINE_DB_USER}
  password = "admin"
  password = ${?AIRLINE_DB_PASSWORD}
}