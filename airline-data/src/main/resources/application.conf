websocketActorSystem {
	pekko {
	  actor {
	    provider = remote
			allow-java-serialization = on
			warn-about-java-serializer-usage = false
	  }
	  remote {
			artery {
				transport = tcp
				canonical {
					#private IP of this server
					hostname = "127.0.0.1"
					port = 2552
				}
				bind {
					hostname = "0.0.0.0"
					port = 2552
				}
	    }
	 }

	}
}

dev=false

# Keep in step with airline-web/conf/application.conf - com.patson.model.User
# reads this in both JVMs (maxAirlinesAllowed is consulted by the simulation).
account {
  allFeaturesUnlocked = true
  allFeaturesUnlocked = ${?AIRLINE_ALL_FEATURES_UNLOCKED}
}


rules {
  # Days an airline must wait between name changes. Upstream enforces 30: on a
  # public server a name is an identity other players are owed some
  # consistency in. Among friends it is just an obstacle. 0 removes the wait.
  renameCooldownDays = 0
  renameCooldownDays = ${?AIRLINE_RENAME_COOLDOWN_DAYS}

  # Reputation needed before an airline may upload its own logo or livery.
  # Upstream requires 40 - a brake on a public server where anyone can register
  # and start posting images. Among friends it only means nobody gets to
  # decorate their airline for the first several hours. 0 removes it.
  brandingMinReputation = 0
  brandingMinReputation = ${?AIRLINE_BRANDING_MIN_REPUTATION}

  # Weeks a delegate is tied up after negotiating a route, before it can be
  # sent anywhere else. Upstream: 12.
  delegateCooldownCycles = 3
  delegateCooldownCycles = ${?AIRLINE_DELEGATE_COOLDOWN_CYCLES}

  # Weeks before the same route may be negotiated again after a negotiation.
  # Upstream: 6, which at five minute cycles is half an hour of real waiting
  # before you may touch a route you have just set up.
  negotiationCooldownCycles = 2
  negotiationCooldownCycles = ${?AIRLINE_NEGOTIATION_COOLDOWN_CYCLES}

  # Airlines needed before an alliance counts as established rather than merely
  # forming - only an established one gets code-sharing and the bonuses.
  # Upstream: 3. On a server of five people that is half of everyone.
  allianceMinMembers = 2
  allianceMinMembers = ${?AIRLINE_ALLIANCE_MIN_MEMBERS}

  # Whether applying to an alliance joins it outright, with no approval.
  # Upstream makes every application wait for a leader to accept it, which
  # needs somebody logged in and looking at the right panel - and is
  # impossible altogether in an alliance that has lost its leader.
  allianceAutoAccept = false
  allianceAutoAccept = ${?AIRLINE_ALLIANCE_AUTO_ACCEPT}

  # How much faster delegates gain their levels than upstream, which takes
  # 4 weeks, a year, three years and ten years. 1 is upstream's pace.
  delegateLevelSpeed = 4
  delegateLevelSpeed = ${?AIRLINE_DELEGATE_LEVEL_SPEED}
}

economy {
  # Money a new airline starts with. The player picks one of three startup
  # profiles; this is the base they are all derived from, so changing it scales
  # them together. Upstream default is 40000000.
  startingCapital = 40000000
  startingCapital = ${?AIRLINE_STARTING_CAPITAL}

  # Extra capital per point of home-airport difficulty, so starting somewhere
  # hard is not a pure penalty. Upstream default is 1000000.
  difficultyBonus = 1000000
  difficultyBonus = ${?AIRLINE_DIFFICULTY_BONUS}

  # Yearly bank interest. The simulation drifts up and down within a band
  # derived from this. Upstream default is 0.12 (12%).
  loanInterestRate = 0.12
  loanInterestRate = ${?AIRLINE_LOAN_INTEREST_RATE}

  # Largest single loan, and how many an airline may hold at once.
  maxLoanAmount = 500000000
  maxLoanAmount = ${?AIRLINE_MAX_LOAN_AMOUNT}
  maxLoans = 10
  maxLoans = ${?AIRLINE_MAX_LOANS}

  # Fuel price the market drifts around. Raising it squeezes every airline's
  # margins. Upstream default is 70.
  fuelPrice = 70
  fuelPrice = ${?AIRLINE_FUEL_PRICE}
}

# How many real seconds one in-game week lasts. Upstream default is 1800
# (30 minutes). Lower it to make the game move faster; keep it well above the
# time a cycle takes to compute, which the simulation logs on every tick.
simulation {
  # A cycle can be run at once, without waiting out the rest of the interval,
  # by creating this file - which is what the Force cycle button does. Both
  # halves of the game have to agree on the path.
  forceCycleFile = "/tmp/airline-force-cycle"
  forceCycleFile = ${?AIRLINE_FORCE_CYCLE_FILE}

  cycleDurationSeconds = 1800
  cycleDurationSeconds = ${?AIRLINE_CYCLE_SECONDS}
}

# Database connection, read by com.patson.data.Constants.
# Defaults match a local install; every value can be overridden by an
# environment variable so that no credential has to be committed.
mysqldb {
  host = "localhost:3306"
  host = ${?AIRLINE_DB_HOST}
  schema = "airline_v2_1"
  schema = ${?AIRLINE_DB_SCHEMA}
  user = "sa"
  user = ${?AIRLINE_DB_USER}
  password = "admin"
  password = ${?AIRLINE_DB_PASSWORD}
}