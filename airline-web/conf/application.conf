# This is the main configuration file for the application.
# ~~~~~

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
#
# This must be changed for production, but we recommend not changing it in this file.
#
# See http://www.playframework.com/documentation/latest/ApplicationSecret for more details.
play.crypto.secret = "changeme"
play.crypto.secret = ${?AIRLINE_APP_SECRET}
play.http.secret.key = "changeme"
play.http.secret.key = ${?AIRLINE_APP_SECRET}


# The application languages
# ~~~~~
play.i18n.langs = [ "en" ]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# play.http.router = my.application.Routes

# Database configuration
# ~~~~~
# You can declare as many datasources as you want.
# By convention, the default datasource is named `default`
#
# db.default.driver=org.h2.Driver
# db.default.url="jdbc:h2:mem:play"
# db.default.username=sa
# db.default.password=""

# Evolutions
# ~~~~~
# You can disable evolutions if needed
# play.evolutions.enabled=false

# You can disable evolutions for a specific datasource if necessary
# play.evolutions.db.default.enabled=false

# Artery Reference: https://pekko.apache.org/docs/pekko/current/remoting-artery.html
pekko {
  actor {
    provider = remote
    allow-java-serialization = on
    warn-about-java-serializer-usage = false
  }
  remote {
    artery {
      transport = tcp
      canonical {
        hostname = "127.0.0.1"
        port = 0
      }
    }
  }
}

websocketActorSystem {
  pekko {
    actor {
      provider = remote
      allow-java-serialization = on
      warn-about-java-serializer-usage = false
    }
    remote {
      artery {
        transport = tcp
        canonical {
          hostname = "127.0.0.1" #your private IP here
          port = 10999
        }
        bind {
          hostname = "127.0.0.1" #your private IP here
          port = 10999
        }
      }
     
    }
  }
}

my-pinned-dispatcher {
  executor = "thread-pool-executor"
  type = PinnedDispatcher
}

# Database connection, read by com.patson.data.Constants.
# Defaults match a local install; every value can be overridden by an
# environment variable so that no credential has to be committed.
mysqldb {
  host = "localhost:3306"
  host = ${?AIRLINE_DB_HOST}
  schema = "airline_v2_1"
  schema = ${?AIRLINE_DB_SCHEMA}
  user = "sa"
  user = ${?AIRLINE_DB_USER}
  password = "admin"
  password = ${?AIRLINE_DB_PASSWORD}
}

# reCAPTCHA on the signup form. Disabled for private instances: the built-in
# keys belong to airline-club.com and reject tokens from any other hostname,
# which would make it impossible for your friends to register. Only turn this
# back on (with your own keys) if you expose signup to the public internet.
recaptcha {
  enabled = false
  enabled = ${?AIRLINE_RECAPTCHA_ENABLED}
  siteKey = ${?AIRLINE_RECAPTCHA_SITE_KEY}
  secret = ${?AIRLINE_RECAPTCHA_SECRET}
}

admin {
  # Lets an admin take a database backup from the page. Empty means off, which
  # is the default: this names a program the web server will run, and a web
  # server that runs whatever it is asked to is how one break-in becomes all of
  # them. Nothing a request says reaches the command line - only this path is
  # ever run, with no arguments.
  backupScript = ""
  backupScript = ${?AIRLINE_BACKUP_SCRIPT}
}

account {
  # Opens the features upstream reserves for Patreon donors - renaming your
  # airline, custom wallpapers, and a third airline slot. There is nobody to
  # donate to on a private instance, so the gates only lock you out of your
  # own game.
  allFeaturesUnlocked = true
  allFeaturesUnlocked = ${?AIRLINE_ALL_FEATURES_UNLOCKED}

  # Shortest password a player may choose, at signup and at password reset.
  minPasswordLength = 4
  minPasswordLength = ${?AIRLINE_MIN_PASSWORD_LENGTH}
}

ui {
  # How fast the in-game clock and calendar run, as a fraction of one week per
  # cycle. This does not touch the simulation - a cycle is still a week of
  # flying, paid weekly - only the clock the page shows and the aircraft drawn
  # against it. At 0.5 a game week takes two cycles, so the date advances half
  # as fast and the flights on the map take twice as long to cross.
  gameTimeSpeed = 1.0
  gameTimeSpeed = ${?AIRLINE_GAME_TIME_SPEED}

  # Which language a player who has never chosen one sees the interface in.
  # "en" is the game's own, and the only complete one; "pt" translates the
  # interface - menus, tables, buttons, dialogs - leaving airport, city and
  # aircraft names in the original. Each player can change it in Settings.
  language = "en"
  language = ${?AIRLINE_LANGUAGE}
}

rules {
  # Days an airline must wait between name changes. Upstream enforces 30: on a
  # public server a name is an identity other players are owed some
  # consistency in. Among friends it is just an obstacle. 0 removes the wait.
  renameCooldownDays = 0
  renameCooldownDays = ${?AIRLINE_RENAME_COOLDOWN_DAYS}

  # Reputation needed before an airline may upload its own logo or livery.
  # Upstream requires 40 - a brake on a public server where anyone can register
  # and start posting images. Among friends it only means nobody gets to
  # decorate their airline for the first several hours. 0 removes it.
  brandingMinReputation = 0
  brandingMinReputation = ${?AIRLINE_BRANDING_MIN_REPUTATION}

  # Weeks a delegate is tied up after negotiating a route, before it can be
  # sent anywhere else. Upstream: 12.
  delegateCooldownCycles = 3
  delegateCooldownCycles = ${?AIRLINE_DELEGATE_COOLDOWN_CYCLES}

  # Weeks before the same route may be negotiated again after a negotiation.
  # Upstream: 6, which at five minute cycles is half an hour of real waiting
  # before you may touch a route you have just set up.
  negotiationCooldownCycles = 2
  negotiationCooldownCycles = ${?AIRLINE_NEGOTIATION_COOLDOWN_CYCLES}

  # Whether the climb and descent allowance scales with the aircraft.
  # Upstream caps the first 300 km at 350 km/h, the next 400 at 500 and the
  # next 400 at 700 - fixed numbers, so under about 700 km every aircraft
  # faster than 700 km/h takes exactly the same time and paying for speed buys
  # nothing. True makes each cap the same fraction of the aircraft's own speed.
  proportionalClimb = false
  proportionalClimb = ${?AIRLINE_PROPORTIONAL_CLIMB}

  # The largest discount an aircraft gets for being unpopular, as a percentage.
  # Upstream's 70 is written for a server with thousands of players: the
  # discount grows as the number of that model flying in the world falls short
  # of a threshold, and the thresholds are in the hundreds. A handful of
  # friends never reach them, so every model sits at nearly the maximum for
  # ever - and buying one books the discount as profit.
  maxModelDiscountPercent = 70
  maxModelDiscountPercent = ${?AIRLINE_MAX_MODEL_DISCOUNT_PERCENT}

  # Airlines needed before an alliance counts as established rather than merely
  # forming - only an established one gets code-sharing and the bonuses.
  # Upstream: 3. On a server of five people that is half of everyone.
  allianceMinMembers = 2
  allianceMinMembers = ${?AIRLINE_ALLIANCE_MIN_MEMBERS}

  # Whether applying to an alliance joins it outright, with no approval.
  # Upstream makes every application wait for a leader to accept it, which
  # needs somebody logged in and looking at the right panel - and is
  # impossible altogether in an alliance that has lost its leader.
  allianceAutoAccept = false
  allianceAutoAccept = ${?AIRLINE_ALLIANCE_AUTO_ACCEPT}

  # How much faster delegates gain their levels than upstream, which takes
  # 4 weeks, a year, three years and ten years. 1 is upstream's pace.
  delegateLevelSpeed = 4
  delegateLevelSpeed = ${?AIRLINE_DELEGATE_LEVEL_SPEED}
}

economy {
  # Money a new airline starts with. The player picks one of three startup
  # profiles; this is the base they are all derived from, so changing it scales
  # them together. Upstream default is 40000000.
  startingCapital = 40000000
  startingCapital = ${?AIRLINE_STARTING_CAPITAL}

  # Extra capital per point of home-airport difficulty, so starting somewhere
  # hard is not a pure penalty. Upstream default is 1000000.
  difficultyBonus = 1000000
  difficultyBonus = ${?AIRLINE_DIFFICULTY_BONUS}

  # Yearly bank interest. The simulation drifts up and down within a band
  # derived from this. Upstream default is 0.12 (12%).
  loanInterestRate = 0.12
  loanInterestRate = ${?AIRLINE_LOAN_INTEREST_RATE}

  # Largest single loan, and how many an airline may hold at once.
  maxLoanAmount = 500000000
  maxLoanAmount = ${?AIRLINE_MAX_LOAN_AMOUNT}
  maxLoans = 10
  maxLoans = ${?AIRLINE_MAX_LOANS}

  # Fuel price the market drifts around. Raising it squeezes every airline's
  # margins. Upstream default is 70.
  fuelPrice = 70
  fuelPrice = ${?AIRLINE_FUEL_PRICE}
}

simulation {
  # A cycle can be run at once, without waiting out the rest of the interval,
  # by creating this file - which is what the Force cycle button does. Both
  # halves of the game have to agree on the path.
  forceCycleFile = "/tmp/airline-force-cycle"
  forceCycleFile = ${?AIRLINE_FORCE_CYCLE_FILE}

  # The web front-end does not run the simulation, but the in-game clock needs
  # to know how fast a week passes so it can tick at the right speed before
  # the websocket reports a measured one. Keep this equal to the same setting
  # in airline-data/src/main/resources/application.conf.
  cycleDurationSeconds = 1800
  cycleDurationSeconds = ${?AIRLINE_CYCLE_SECONDS}
}

game {
  # Which year the world's calendar starts from. Cycle 0 is 1 January of this
  # year, and every cycle is one week. Purely cosmetic - nothing in the
  # simulation reads the date - but a world starting in 1970 looks odd.
  startYear = 1970
  startYear = ${?AIRLINE_GAME_START_YEAR}

  # Decorative video clips shown during route negotiation. They live on the
  # upstream author's Vimeo account, and browsers with tracking protection
  # block them, leaving an error panel in the middle of the dialog.
  negotiationClips = false
  negotiationClips = ${?AIRLINE_NEGOTIATION_CLIPS}

  # Upstream's promotional video on the front page. It autoplays and the Vimeo
  # player then talks to four of their domains on every visit - heartbeats,
  # session beacons, player statistics - to advertise a game the visitor is
  # already running.
  landingVideo = false
  landingVideo = ${?AIRLINE_LANDING_VIDEO}
}

images {
  # Where photographs of cities and airports come from.
  #
  # "wikipedia" - Wikipedia's geosearch, by coordinates. No key, no account,
  #               no billing. Lookup is by position rather than name, since
  #               place names are ambiguous and the game knows the coordinates.
  # "google"    - upstream behaviour; needs google.apiKey on a billing-enabled
  #               Cloud project.
  # "none"      - no pictures; the game shows its own placeholder.
  provider = "wikipedia"
  provider = ${?AIRLINE_IMAGE_PROVIDER}

  # Which Wikipedia to ask. "en" has by far the most articles with photographs;
  # "pt" would prefer Portuguese articles but finds fewer images.
  wikipediaLanguage = "en"
  wikipediaLanguage = ${?AIRLINE_WIKIPEDIA_LANGUAGE}
}

map {
  # "osm"    - OpenStreetMap via Leaflet. No API key, no billing, no Google.
  # "google" - upstream behaviour; requires google.mapKey and a billing
  #            account on a Google Cloud project.
  provider = "osm"
  provider = ${?AIRLINE_MAP_PROVIDER}

  # Tile sources for the osm provider, one per theme. CARTO's basemaps are a
  # matched pair - the same cartography light and dark - and need no API key.
  # Plain OpenStreetMap has no dark equivalent, which is why it is not the
  # default here any more: the two themes would look like different maps.
  tileUrlLight = "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"
  tileUrlLight = ${?AIRLINE_MAP_TILE_URL_LIGHT}
  tileUrlDark = "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
  tileUrlDark = ${?AIRLINE_MAP_TILE_URL_DARK}

  # Setting this overrides BOTH themes - for pointing at your own tile server.
  # Note that it therefore turns the light/dark switch into a no-op: both
  # themes then draw the same tiles.
  tileUrl = ${?AIRLINE_MAP_TILE_URL}

  # What language the map labels the world in.
  #
  # "local"   - each country in its own language, as OpenStreetMap draws it.
  #             Faithful, and hard to read across a continent you cannot spell.
  # "english" - Esri's world street map, labelled in English almost everywhere.
  #             One palette, so the dark theme is made by inverting the tiles in
  #             the browser - see osm-dark-filter.
  #
  # Wikimedia's international style was tried here and does not work: they serve
  # it to their own sites only and answer everyone else with nothing, which
  # shows up as a blank map with the markers still floating on it.
  #
  # Setting map.tileUrl or the per-theme URLs below overrides this entirely.
  labels = "local"
  labels = ${?AIRLINE_MAP_LABELS}

  # Whether the dark theme is produced by inverting light tiles.
  # "auto" does it only when light and dark would draw the same tiles.
  darkFilter = "auto"
  darkFilter = ${?AIRLINE_MAP_DARK_FILTER}

  # How fast the aircraft cross the map, as a fraction of the real thing. One
  # cycle is one week of flying, so at five minute cycles a short leg crosses
  # in a couple of seconds - accurate, and impossible to click. Below 1 the
  # aircraft still leaves at exactly its scheduled time and takes longer to
  # arrive; the departure is the part that has to be true.
  flightSpeed = 0.5
  flightSpeed = ${?AIRLINE_MAP_FLIGHT_SPEED}

  # How the map decides between its light and dark tiles.
  #
  # "follow" - matches the game's own Color Theme, under Settings. One choice
  #            for the whole game, which is what a player expects.
  # "dark" / "light" - pins the map, whatever the rest of the game is set to.
  theme = "follow"
  theme = ${?AIRLINE_MAP_THEME}

  # Where the map opens. Upstream centres on the Pacific, which is a long drag
  # away from most people's airline.
  defaultLat = 39.5
  defaultLat = ${?AIRLINE_MAP_DEFAULT_LAT}
  defaultLng = -8.0
  defaultLng = ${?AIRLINE_MAP_DEFAULT_LNG}
  defaultZoom = 5
  defaultZoom = ${?AIRLINE_MAP_DEFAULT_ZOOM}
}

search {
  # Who answers the search boxes.
  #
  # "local"         - the game's own index, held in memory and rebuilt as
  #                   things change. Nothing to install and nothing to run
  #                   alongside the game. It ignores accents, matches words in
  #                   the middle of a name and forgives typos.
  # "elasticsearch" - upstream behaviour, against a server on localhost:9200.
  #                   The local index still answers whatever Elasticsearch
  #                   does not, so a stopped server is no longer a silent
  #                   dead end.
  engine = "local"
  engine = ${?AIRLINE_SEARCH_ENGINE}
}

sim.pekko-actor.host="127.0.0.1:2552"
weather {
  # Real weather on the departure board, from OpenWeatherMap. Upstream baked
  # its own key into the source; being in a public repository, that key is
  # shared by every copy of the game and is rate-limited accordingly. Get a
  # free one at openweathermap.org, or set this to "off" to stop asking - the
  # board then simply shows no weather, and no flight is ever delayed by it.
  apiKey = "a73aa7c1bf75d7e3cb83d45a40d50c78"
  apiKey = ${?AIRLINE_WEATHER_API_KEY}
}

google.mapKey="your key"
google.mapKey=${?AIRLINE_GOOGLE_MAP_KEY}
google.apiKey="your key"
google.apiKey=${?AIRLINE_GOOGLE_API_KEY}

# How long browsers may keep the game's JavaScript and stylesheets.
#
# Play's default is an hour, and the asset URLs carry no fingerprint - they are
# plain /assets/javascripts/main.js, the same address before and after an
# update. So for an hour after every update each player keeps running the old
# scripts without even asking whether there is a new one, and the symptom is
# the worst kind: the page is new, the code behind it is not, and the two
# disagree in ways nobody can explain.
#
# "no-cache" does not mean "do not store" - the browser still keeps the file and
# still asks, but it asks. Play answers with the ETag it already computes, so an
# unchanged file costs a 304 and no body. Correctness for a few hundred bytes.
play.assets.defaultCache = "no-cache"

play.allowGlobalApplication = true

play.filters.disabled += "play.filters.csrf.CSRFFilter"
play.filters.enabled += "play.filters.gzip.GzipFilter"
play.filters.hosts {
  allowed = ["."]
}

play.filters.gzip {
 contentType {

    # If non empty, then a response will only be compressed if its content type is in this list.
    whiteList = [ "text/*", "application/javascript", "application/json" ]

    # The black list is only used if the white list is empty.
    # Compress all responses except the ones whose content type is in this list.
    blackList = []
  }
}

play.assets.cache."/public/images" = "public, max-age=31536000, immutable"
play.assets.cache."/public/music" = "public, max-age=31536000, immutable"

bannerEnabled = false
